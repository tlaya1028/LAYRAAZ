<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D251C">
  <title>LAYRAAZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Patrick+Hand&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar collapsed" id="sidebar">

      <div class="brand-block">
        <div class="brand">
          LAYRAAZ<span class="brand-spark">✦</span>
        </div>

        <div class="brand-sub">
          for the version of you<br>
          you're becoming
        </div>
      </div>

      <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="Open sidebar"
        aria-expanded="false"
      >
        <span class="icon icon-menu"></span>
      </button>

      <nav class="nav-list" aria-label="Main navigation">

        <button
          class="nav-item"
          data-section="profile"
          type="button"
          title="Profile"
        >
          <span class="nav-icon icon-profile"></span>
          <span class="nav-label">Profile</span>
        </button>

        <button
          class="nav-item active"
          data-section="dashboard"
          type="button"
          title="Dashboard"
        >
          <span class="nav-icon icon-home"></span>
          <span class="nav-label">Dashboard</span>
        </button>

        <button
          class="nav-item"
          data-section="reminders"
          type="button"
          title="Reminders"
        >
          <span class="nav-icon icon-bell"></span>
          <span class="nav-label">Reminders</span>
        </button>

        <button
          class="nav-item"
          data-section="todos"
          type="button"
          title="To-do List"
        >
          <span class="nav-icon icon-check"></span>
          <span class="nav-label">To-do List</span>
        </button>

        <button
          class="nav-item"
          data-section="goals"
          type="button"
          title="Goals"
        >
          <span class="nav-icon icon-target"></span>
          <span class="nav-label">Goals</span>
        </button>

        <button
          class="nav-item"
          data-section="notes"
          type="button"
          title="Notes"
        >
          <span class="nav-icon icon-note"></span>
          <span class="nav-label">Notes</span>
        </button>

        <button
          class="nav-item"
          data-section="notifications"
          type="button"
          title="Notifications"
        >
          <span class="nav-icon icon-notification"></span>
          <span class="nav-label">Notifications</span>
        </button>

        <button
          class="nav-item"
          data-section="appearance"
          type="button"
          title="Appearance"
        >
          <span class="nav-icon icon-palette"></span>
          <span class="nav-label">Appearance</span>
        </button>

        <button
          class="nav-item"
          data-section="character"
          type="button"
          title="Character"
        >
          <span class="nav-icon icon-character"></span>
          <span class="nav-label">Character</span>
        </button>

      </nav>

      <div class="sidebar-footer">
        <div class="tiny-quote">
          You are doing better than you think you are.
          <span>♡</span>
        </div>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

      <header class="topbar">

        <div class="topbar-copy">

          <div class="eyebrow">
            YOUR LITTLE DIGITAL SPACE
          </div>

          <h1 id="pageTitle">
            Welcome back, Laya
            <span class="sparkles">✦</span>
          </h1>

          <p id="pageSubtitle">
            A small space for everything that matters.
            <span>♡</span>
          </p>

        </div>


        <div class="topbar-actions">

          <div class="search-wrap">

            <input
              id="globalSearch"
              type="search"
              placeholder="Search anything..."
              autocomplete="off"
            >

            <span class="search-icon icon-search"></span>

          </div>


          <button
            class="icon-button notification-button"
            id="topNotificationButton"
            type="button"
            aria-label="Notifications"
          >

            <span class="nav-icon icon-notification"></span>

            <span
              class="notification-count"
              id="notificationCount"
            ></span>

          </button>


          <button
            class="profile-mini"
            id="profileMiniButton"
            type="button"
          >

            <span
              class="avatar"
              id="topAvatar"
            ></span>

            <span id="topName">
              Laya
            </span>

            <span class="chevron">
              ⌄
            </span>

          </button>

        </div>

      </header>


      <!-- SEARCH -->
      <div
        id="searchResults"
        class="search-results hidden"
      ></div>


      <!-- SECTIONS -->
      <section
        id="profile"
        class="page-section"
      ></section>

      <section
        id="dashboard"
        class="page-section active-section"
      ></section>

      <section
        id="reminders"
        class="page-section"
      ></section>

      <section
        id="todos"
        class="page-section"
      ></section>

      <section
        id="goals"
        class="page-section"
      ></section>

      <section
        id="notes"
        class="page-section"
      ></section>

      <section
        id="notifications"
        class="page-section"
      ></section>

      <section
        id="appearance"
        class="page-section"
      ></section>

      <section
        id="character"
        class="page-section"
      ></section>

    </main>

  </div>


  <!-- FLOATING REMINDER CHARACTER -->
  <div
    id="reminderCompanion"
    class="reminder-companion hidden"
    aria-live="polite"
  ></div>


  <!-- MODALS -->
  <div id="modalRoot"></div>


  <script src="script.js"></script>

</body>
</html>
