<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1D251C">

    <title>LAYRAAZ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toast" class="toast" aria-live="polite"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar collapsed" id="sidebar">

        <div class="brand-block">
            <div class="brand">
                LAYRAAZ
                <span class="brand-sparkle">✦</span>
            </div>

            <div class="brand-sub">
                your little digital space<br>
                for the version you're becoming
            </div>
        </div>

        <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Open sidebar">
            <span class="icon icon-menu"></span>
        </button>

        <nav class="nav-list">

            <button class="nav-item" data-section="profile" type="button">
                <span class="nav-icon icon-profile"></span>
                <span>Profile</span>
            </button>

            <button class="nav-item active" data-section="dashboard" type="button">
                <span class="nav-icon icon-home"></span>
                <span>Dashboard</span>
            </button>

            <button class="nav-item" data-section="character" type="button">
                <span class="nav-icon icon-character"></span>
                <span>Character</span>
            </button>

            <button class="nav-item" data-section="reminders" type="button">
                <span class="nav-icon icon-bell"></span>
                <span>Reminders</span>
            </button>

            <button class="nav-item" data-section="todos" type="button">
                <span class="nav-icon icon-check"></span>
                <span>To-do List</span>
            </button>

            <button class="nav-item" data-section="goals" type="button">
                <span class="nav-icon icon-target"></span>
                <span>Goals</span>
            </button>

            <button class="nav-item" data-section="notes" type="button">
                <span class="nav-icon icon-note"></span>
                <span>Notes</span>
            </button>

            <button class="nav-item" data-section="notifications" type="button">
                <span class="nav-icon icon-notification"></span>
                <span>Notifications</span>
            </button>

            <button class="nav-item" data-section="appearance" type="button">
                <span class="nav-icon icon-palette"></span>
                <span>Appearance</span>
            </button>

        </nav>

        <div class="sidebar-footer">
            A little progress is still progress.
            <span>♡</span>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <header class="topbar">

            <div class="top-copy">

                <div class="eyebrow">
                    YOUR LITTLE DIGITAL SPACE
                </div>

                <h1 id="pageTitle">
                    Welcome back, Laya
                    <span class="title-sparkle">✦</span>
                </h1>

                <p id="pageSubtitle">
                    Take a deep breath. You've got this. ♡
                </p>

            </div>

            <div class="top-actions">

                <div class="search">
                    <input
                        id="globalSearch"
                        type="search"
                        placeholder="Search anything..."
                        autocomplete="off">

                    <span class="icon icon-search"></span>
                </div>

                <button
                    class="round-btn"
                    id="notificationBtn"
                    type="button"
                    aria-label="Notifications">

                    <span class="nav-icon icon-notification"></span>
                    <b id="notificationCount"></b>

                </button>

                <button
                    class="profile-mini"
                    id="profileBtn"
                    type="button">

                    <span
                        class="avatar"
                        id="topAvatar">
                    </span>

                    <span id="topName">Laya</span>

                    <span class="profile-arrow">⌄</span>

                </button>

            </div>

        </header>


        <!-- SEARCH -->
        <div
            id="searchResults"
            class="search-results hidden">
        </div>


        <!-- PAGES -->
        <section id="profile" class="page-section"></section>

        <section id="dashboard" class="page-section active"></section>

        <section id="character" class="page-section"></section>

        <section id="reminders" class="page-section"></section>

        <section id="todos" class="page-section"></section>

        <section id="goals" class="page-section"></section>

        <section id="notes" class="page-section"></section>

        <section id="notifications" class="page-section"></section>

        <section id="appearance" class="page-section"></section>

    </main>

</div>


<!-- MODALS -->
<div id="modalRoot"></div>


<!-- FLOATING CHARACTER -->
<div
    id="companionReminder"
    class="companion-reminder hidden"
    aria-live="assertive">

    <div class="companion-sticker-wrap">
        <img id="companionSticker" alt="Character">
    </div>

    <div class="companion-bubble">
        <button
            id="closeCompanion"
            class="companion-close"
            type="button">
            ×
        </button>

        <strong id="companionTitle">
            Reminder
        </strong>

        <span id="companionMessage">
            Something needs your attention.
        </span>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
