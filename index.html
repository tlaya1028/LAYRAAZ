<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D251C">
  <title>LAYRAAZ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar" id="sidebar" aria-label="Main navigation">

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <div class="brand">LAYRAAZ</div>

    <nav class="nav-list">

      <button class="nav-item active" data-section="profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2"/>
            <path d="M5.5 20c.8-3.7 3-5.5 6.5-5.5s5.7 1.8 6.5 5.5"/>
          </svg>
        </span>
        <span>Profile</span>
      </button>

      <button class="nav-item" data-section="dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="6.5" height="6.5" rx="1"/>
            <rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/>
            <rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/>
            <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/>
          </svg>
        </span>
        <span>Dashboard</span>
      </button>

      <button class="nav-item" data-section="reminders">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </span>
        <span>Reminders</span>
      </button>

      <button class="nav-item" data-section="todos">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="16" rx="2"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
          </svg>
        </span>
        <span>To-do List</span>
      </button>

      <button class="nav-item" data-section="goals">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l2.2 6.1L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-1.9L12 3z"/>
          </svg>
        </span>
        <span>Goals</span>
      </button>

      <button class="nav-item" data-section="notes">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h12v16H6z"/>
            <path d="M9 8h6M9 12h6M9 16h4"/>
          </svg>
        </span>
        <span>Notes</span>
      </button>

      <button class="nav-item" data-section="notifications">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
        </span>
        <span>Notifications</span>
      </button>

      <button class="nav-item" data-section="appearance">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 4v16M12 12h8"/>
          </svg>
        </span>
        <span>Appearance</span>
      </button>

      <button class="nav-item" data-section="character">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"/>
            <path d="M8.5 10h.01M15.5 10h.01"/>
            <path d="M9 15c1.8 1.5 4.2 1.5 6 0"/>
          </svg>
        </span>
        <span>Character</span>
      </button>

    </nav>

    <div class="sidebar-foot">
      Your quiet little command centre.
    </div>

  </aside>


  <main class="app-shell">

    <header class="topbar">

      <div>
        <div class="eyebrow">PERSONAL COMMAND CENTRE</div>
        <h1 id="pageTitle">Profile</h1>
      </div>

      <div class="top-actions">

        <label class="search-box" aria-label="Search LAYRAAZ">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.6"/>
            <path d="m16 16 4.5 4.5"/>
          </svg>

          <input
            id="globalSearch"
            type="search"
            placeholder="Search..."
            autocomplete="off"
          >

        </label>

        <button
          class="icon-button"
          id="notificationButton"
          title="Notifications"
          aria-label="Notifications"
        >

          <svg viewBox="0 0 24 24">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>

          <span
            id="notificationDot"
            class="notification-dot hidden"
          ></span>

        </button>

      </div>

    </header>


    <section
      id="appContent"
      class="content"
      aria-live="polite"
    ></section>

  </main>


  <div
    id="toast"
    class="toast"
    role="status"
  ></div>


  <div
    id="companion"
    class="companion hidden"
    aria-live="assertive"
  >

    <div class="companion-sticker-wrap">
      <img
        id="companionSticker"
        alt="Character"
      >
    </div>

    <div class="speech-bubble">

      <strong id="companionName">
        Character
      </strong>

      <p id="companionMessage"></p>

      <div class="companion-actions">

        <button id="companionDone">
          DONE
        </button>

        <button id="companionSnooze">
          SNOOZE 5 MIN
        </button>

      </div>

    </div>

  </div>


  <input
    id="profileImageInput"
    type="file"
    accept="image/*"
    hidden
  >

  <input
    id="characterImageInput"
    type="file"
    accept="image/*"
    hidden
  >


  <script src="script.js?v=20260902"></script>

</body>
</html>
