<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1D251C">
<meta name="description" content="LAYRAAZ - your little digital space">

<title>LAYRAAZ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Patrick+Hand&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toast" class="toast" aria-live="polite"></div>

<div class="app-shell">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar collapsed" id="sidebar">

        <div class="brand-block">

            <div class="brand">
                LAYRAAZ<span>✦</span>
            </div>

            <div class="brand-sub">
                for the version of you<br>
                you're becoming
            </div>

        </div>

        <button
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Open or close sidebar"
            type="button">

            <span class="icon icon-menu"></span>

        </button>

        <nav class="nav-list">

            <!-- PROFILE FIRST -->
            <button class="nav-item" data-section="profile" type="button">
                <span class="nav-icon icon-profile"></span>
                <span>Profile</span>
            </button>

            <button class="nav-item active" data-section="dashboard" type="button">
                <span class="nav-icon icon-home"></span>
                <span>Dashboard</span>
            </button>

            <button class="nav-item" data-section="character" type="button">
                <span class="nav-icon icon-character"></span>
                <span>Character</span>
            </button>

            <button class="nav-item" data-section="reminders" type="button">
                <span class="nav-icon icon-bell"></span>
                <span>Reminders</span>
            </button>

            <button class="nav-item" data-section="todos" type="button">
                <span class="nav-icon icon-check"></span>
                <span>To-do List</span>
            </button>

            <button class="nav-item" data-section="goals" type="button">
                <span class="nav-icon icon-target"></span>
                <span>Goals</span>
            </button>

            <button class="nav-item" data-section="notes" type="button">
                <span class="nav-icon icon-note"></span>
                <span>Notes</span>
            </button>

            <button class="nav-item" data-section="notifications" type="button">
                <span class="nav-icon icon-notification"></span>
                <span>Notifications</span>
            </button>

            <button class="nav-item" data-section="appearance" type="button">
                <span class="nav-icon icon-palette"></span>
                <span>Appearance</span>
            </button>

        </nav>

        <div class="sidebar-footer">
            You are doing better than you think you are.
            <span>♡</span>
        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-content">

        <header class="topbar">

            <div class="top-heading">

                <div class="eyebrow">
                    YOUR LITTLE DIGITAL SPACE
                </div>

                <h1 id="pageTitle">
                    Welcome back, Laya ✦
                </h1>

                <p id="pageSubtitle">
                    Take a deep breath. You've got this. ♡
                </p>

            </div>


            <div class="top-actions">

                <div class="search">

                    <input
                        id="globalSearch"
                        type="search"
                        placeholder="Search anything..."
                        autocomplete="off">

                    <span class="icon icon-search"></span>

                </div>


                <button
                    class="round-btn"
                    id="notificationBtn"
                    aria-label="Open notifications"
                    type="button">

                    <span class="nav-icon icon-notification"></span>

                    <b id="notificationCount"></b>

                </button>


                <button
                    class="profile-mini"
                    id="profileBtn"
                    type="button">

                    <span
                        class="avatar"
                        id="topAvatar">
                    </span>

                    <span id="topName">
                        Laya
                    </span>

                    <span class="chevron">⌄</span>

                </button>

            </div>

        </header>


        <!-- SEARCH RESULTS -->

        <div
            id="searchResults"
            class="search-results hidden">
        </div>


        <!-- =========================
             PAGES
        ========================== -->

        <section
            id="profile"
            class="page-section">
        </section>

        <section
            id="dashboard"
            class="page-section active">
        </section>

        <section
            id="character"
            class="page-section">
        </section>

        <section
            id="reminders"
            class="page-section">
        </section>

        <section
            id="todos"
            class="page-section">
        </section>

        <section
            id="goals"
            class="page-section">
        </section>

        <section
            id="notes"
            class="page-section">
        </section>

        <section
            id="notifications"
            class="page-section">
        </section>

        <section
            id="appearance"
            class="page-section">
        </section>

    </main>

</div>


<!-- MODALS -->

<div id="modalRoot"></div>


<script src="script.js"></script>

</body>
</html>
